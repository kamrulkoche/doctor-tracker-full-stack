# Render blueprint for the Doctor Tracker API.
# Secrets are declared with `sync: false`: Render prompts for them, nothing is stored in git.
services:
  - type: web
    name: doctor-tracker-backend
    runtime: node
    plan: free
    rootDir: doctor-tracker-backend
    # --include=dev: TypeScript is a devDependency and NODE_ENV=production would otherwise skip it.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
